spring.application.name=carritodecompras-backend
server.port=8080
spring.config.import=optional:file:./application-local.properties

# MySQL (Laragon por defecto: usuario root, sin clave)
spring.datasource.url=jdbc:mysql://localhost:3306/shop?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Supabase Storage (bucket CarritoCompras)
supabase.url=https://dtqvhymysiawubjggtjr.supabase.co
supabase.storage.bucket=CarritoCompras
supabase.service-key=${SUPABASE_SERVICE_KEY:}

# Límite de subida de archivos (5 MB, igual que el bucket en Supabase)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
